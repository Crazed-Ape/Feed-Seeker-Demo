name: scan

# Runs the Seeker demo scanner over every file in this repo on each push and pull request.
# tools/demo/ is a byte-identical copy of the same folder in the engine repo.
# Standard library only: no package installs, no secrets, no network after checkout.
# Every action is pinned by commit SHA (the tag is in the comment).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, runs on Node 24
        with:
          persist-credentials: false
      - name: Scan every file
        run: python3 -I -B tools/demo/scan.py .
